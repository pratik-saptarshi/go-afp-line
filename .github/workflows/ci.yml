name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: test
        run: go test -race ./...
