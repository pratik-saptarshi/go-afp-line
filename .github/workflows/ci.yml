name: ci

on:
  # PR branch pushes are validated by the pull_request run below, which
  # tests the merge commit (the actual merge result); the push trigger
  # covers direct pushes to main. This yields exactly one run per push
  # while never leaving the merged result untested.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # head_ref is set for pull_request events; ref_name for push. Using both
  # puts the push run and the PR synchronize run for the same branch in one
  # group, so a push to an open PR cancels the in-flight duplicate and
  # exactly one run completes. (github.ref would NOT work: push uses
  # refs/heads/<branch> while pull_request uses refs/pull/<N>/merge.)
  # The head repository scopes the group so fork PRs reusing a branch name
  # (commonly main or patch-1) cannot cancel each other's validation; for
  # push events head.repo is empty and this falls back to this repository.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: test
        run: go test -race -shuffle=on ./...
      - name: coverage floor
        # Coverage floor: the build fails if total statement coverage drops
        # below 85%. Measured total coverage when the floor was set
        # (2026-10-15): 87.7%. Re-measure and raise the floor if coverage
        # improves materially.
        run: |
          FLOOR=85
          go test -shuffle=on -coverprofile=coverage.out ./... > /dev/null
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%$/, "", $3); print $3}')
          echo "total coverage: ${TOTAL}% (floor: ${FLOOR}%)"
          awk -v got="${TOTAL}" -v want="${FLOOR}" 'BEGIN {exit !(got >= want)}' \
            || { echo "coverage ${TOTAL}% is below floor ${FLOOR}%"; exit 1; }

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
